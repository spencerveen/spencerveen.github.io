name: Epoch browser movement QA

on:
  pull_request:
    paths:
      - 'epoch/**'
      - '.github/workflows/epoch-browser-walk.yml'
  push:
    branches: [main]
    paths:
      - 'epoch/**'
      - '.github/workflows/epoch-browser-walk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-walk:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify mountain flint, beaches, and chunk streaming
        run: |
          node epoch/tests/check-mountain-flint.mjs
          node epoch/tests/check-beaches.mjs
          node epoch/tests/check-forest.mjs
      - name: Verify assignable villager jobs, finite gathering and stockpile deliveries
        run: node epoch/tests/check-villager-jobs.mjs
      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.58.2
      - name: Launch Epoch static test server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/epoch-http.log 2>&1 &
          sleep 1
      - name: Hunt a rabbit with H, gather its carcass with F, and reload the world
        run: node epoch/tests/browser-hunting.mjs
      - name: Cook meals at the hearth and eat them with E in Chromium
        run: node epoch/tests/browser-cooking.mjs
      - name: Catch a shallow-water fish and roast it at the hearth
        run: node epoch/tests/browser-fishing.mjs
      - name: Explore ocean shore, wading, open water and streaming in Chromium
        run: node epoch/tests/browser-ocean.mjs
      - name: Validate swimming across rivers in Chromium
        run: node epoch/tests/browser-swimming.mjs
      - name: Validate building-driven interfaces and responsive controls
        run: node epoch/tests/browser-contextual-ui.mjs
      - name: Explore seeded wilderness tribes and interact with their leaders
        run: node epoch/tests/browser-tribes.mjs
      - name: Validate survival HUD, eating, sprinting and permanent death
        run: node epoch/tests/browser-survival.mjs
      - name: Verify E quick eat and F nearby interaction shortcuts
        run: node epoch/tests/browser-quick-eat.mjs
      - name: Verify L-key developer panel and live survival cheats
        run: node epoch/tests/browser-dev-cheats.mjs
      - name: Validate equipment controls, swaps and persistence
        run: node epoch/tests/browser-equipment.mjs
      - name: Craft a club, axe and spear in the stockpile interface
        run: node epoch/tests/browser-crafting.mjs
      - name: Validate water meshes, deep-water collision and chunk cleanup
        run: node epoch/tests/browser-water.mjs
      - name: Inspect exposed mountain rock and vegetation streaming in Chromium
        run: node epoch/tests/browser-mountain-appearance.mjs
      - name: Validate natural aging, death succession, memorials and a clean HUD
        run: node epoch/tests/browser-aging.mjs
      - name: Confirm imported 3D humanoids animate in Chromium
        run: node epoch/tests/browser-walk.mjs
      - name: Preserve screenshots and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epoch-browser-walk
          path: |
            epoch/tests/artifacts/
            /tmp/epoch-http.log
          retention-days: 7
