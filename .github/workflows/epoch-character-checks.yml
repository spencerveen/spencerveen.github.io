name: Epoch character asset checks

on:
  pull_request:
    paths:
      - 'epoch/**'
      - '.github/workflows/epoch-character-checks.yml'
  push:
    branches: [main]
    paths:
      - 'epoch/**'
      - '.github/workflows/epoch-character-checks.yml'

jobs:
  validate-glb:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check Epoch JavaScript module syntax
        run: |
          node --check epoch/js/main.js
          node --check epoch/js/ui.js
          node --check epoch/js/world.js
          node --check epoch/js/village-ui.js
          node --check epoch/js/residents.js
          node --check epoch/js/survival.js
          node --check epoch/js/swimming.js
          node --check epoch/js/harvest.js
          node --check epoch/js/inventory-ui.js
          node --check epoch/js/equipment.js
          node --check epoch/js/dev-cheats.js
          node --check epoch/js/ocean-generation.js
          node --check epoch/js/water-generation.js
          node --check epoch/js/water-corridors.js
          node --check epoch/js/mountain-generation.js
          node --check epoch/js/mountain-appearance.js
          node --check epoch/js/forest-chunks.js
      - name: Validate contextual interfaces and research/culture bootstrap
        run: node epoch/tests/check-contextual-ui.mjs
      - name: Validate compact inventory menus and village-only crafting
        run: node epoch/tests/check-inventory-menus.mjs
      - name: Validate Stone Age catalog, equipment, swaps and save migration
        run: node epoch/tests/check-equipment.mjs
      - name: Validate civilization-based Knowledge and single-founder population
        run: node epoch/tests/check-technology-progression.mjs
      - name: Validate procedural tribes, discovery and save persistence
        run: node epoch/tests/check-tribes.mjs
      - name: Validate peaceful tribe quests, housing and resident migration
        run: node epoch/tests/check-recruitment.mjs
      - name: Validate individual resident profiles, housing and legacy migrations
        run: node epoch/tests/check-residents.mjs
      - name: Validate Hut household views and no manual succession
        run: node epoch/tests/check-huts.mjs
      - name: Validate hunger, stamina, berries, injuries and survivor succession
        run: node epoch/tests/check-survival.mjs
      - name: Verify swimming stamina drain and floating recovery
        run: node epoch/tests/check-swimming.mjs
      - name: Validate temporary developer cheats without corrupting saves
        run: node epoch/tests/check-dev-cheats.mjs
      - name: Validate annual villager aging, natural death and succession at age 100
        run: node epoch/tests/check-aging.mjs
      - name: Validate title save slots, migration and character creation locks
        run: node epoch/tests/check-save-slots.mjs
      - name: Validate permanent resource depletion and berry regeneration
        run: node epoch/tests/check-resource-nodes.mjs
      - name: Validate free building grid and legacy village migration
        run: node epoch/tests/check-village-grid.mjs
      - name: Validate village founding and stockpile logistics
        run: node epoch/tests/check-stockpile.mjs
      - name: Validate ten-slot inventory and save migration
        run: node epoch/tests/check-inventory.mjs
      - name: Validate seeded forest generation and chunk streaming
        run: node epoch/tests/check-forest.mjs
      - name: Validate rivers, lakes, dry village protection and water collision
        run: node epoch/tests/check-water.mjs
      - name: Validate seeded ocean coastlines, sand, water depth and protected villages
        run: node epoch/tests/check-ocean.mjs
      - name: Validate mountain ranges, foothills and protected settlements
        run: node epoch/tests/check-mountains.mjs
      - name: Validate river valleys through mountains without relocating saved water
        run: node epoch/tests/check-river-valleys.mjs
      - name: Validate slope-driven stone colors and streamed rock outcrops
        run: node epoch/tests/check-mountain-appearance.mjs
      - name: Validate village and building save compatibility
        run: node epoch/tests/check-settlement.mjs
      - name: Inspect game models
        run: node epoch/tests/check-models.mjs
      - name: Inspect real Quaternius skinned characters and hairstyles
        run: node epoch/tests/check-quaternius.mjs
      - name: Validate Quaternius walking animation clips
        run: |
          node epoch/tests/check-walk-clips.mjs
          node epoch/tests/check-locomotion-runtime.mjs
      - name: Validate builder reproduces the checked-in assets
        run: |
          node epoch/tools/build-avatar-glb.js
          git diff --exit-code -- epoch/assets/characters/
