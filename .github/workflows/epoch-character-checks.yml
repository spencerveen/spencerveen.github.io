name: Epoch character asset checks

on:
  pull_request:
    paths:
      - 'epoch/assets/characters/**'
      - 'epoch/tools/**'
      - 'epoch/tests/**'
      - 'epoch/js/character-models.js'
      - 'epoch/js/quaternius-models.js'
      - 'epoch/js/locomotion.js'
      - 'epoch/js/settlement.js'
      - 'epoch/js/stockpile.js'
      - 'epoch/js/save-slots.js'
      - 'epoch/js/title-screen.js'
      - 'epoch/js/stockpile-world.js'
      - 'epoch/js/inventory.js'
      - 'epoch/js/resource-nodes.js'
      - 'epoch/js/harvest.js'
      - 'epoch/js/inventory-ui.js'
      - 'epoch/js/forest-generation.js'
      - 'epoch/js/forest-chunks.js'
      - 'epoch/js/village-world.js'
      - 'epoch/js/village-ui.js'
      - '.github/workflows/epoch-character-checks.yml'
  push:
    branches: [main]
    paths:
      - 'epoch/assets/characters/**'
      - 'epoch/tools/**'
      - 'epoch/tests/**'
      - 'epoch/js/character-models.js'
      - 'epoch/js/quaternius-models.js'
      - 'epoch/js/locomotion.js'
      - 'epoch/js/settlement.js'
      - 'epoch/js/stockpile.js'
      - 'epoch/js/save-slots.js'
      - 'epoch/js/title-screen.js'
      - 'epoch/js/stockpile-world.js'
      - 'epoch/js/inventory.js'
      - 'epoch/js/resource-nodes.js'
      - 'epoch/js/harvest.js'
      - 'epoch/js/inventory-ui.js'
      - 'epoch/js/forest-generation.js'
      - 'epoch/js/forest-chunks.js'
      - 'epoch/js/village-world.js'
      - 'epoch/js/village-ui.js'

jobs:
  validate-glb:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate title save slots, migration and character creation locks
        run: node epoch/tests/check-save-slots.mjs
      - name: Validate permanent resource depletion and berry regeneration
        run: node epoch/tests/check-resource-nodes.mjs
      - name: Validate village founding and stockpile logistics
        run: node epoch/tests/check-stockpile.mjs
      - name: Validate ten-slot inventory and save migration
        run: node epoch/tests/check-inventory.mjs
      - name: Validate seeded forest generation and chunk streaming
        run: node epoch/tests/check-forest.mjs
      - name: Validate village and building save compatibility
        run: node epoch/tests/check-settlement.mjs
      - name: Inspect game models
        run: node epoch/tests/check-models.mjs
      - name: Inspect real Quaternius skinned characters and hairstyles
        run: node epoch/tests/check-quaternius.mjs
      - name: Validate Quaternius walking animation clips
        run: |
          node epoch/tests/check-walk-clips.mjs
          node epoch/tests/check-locomotion-runtime.mjs
      - name: Validate builder reproduces the checked-in assets
        run: |
          node epoch/tools/build-avatar-glb.js
          git diff --exit-code -- epoch/assets/characters/
