name: Build optimized Epoch sky assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/epoch-sky-assets.yml'
      - 'epoch/scripts/build-sky-assets.py'
      - 'epoch/assets/sky/SOURCES.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare WebP converter
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Download official CC0 panoramas and produce browser assets
        run: python epoch/scripts/build-sky-assets.py
      - name: Verify generated WebP dimensions and local files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root = Path("epoch/assets/sky")
          m = json.loads((root / "manifest.json").read_text())
          assert set(m["panoramas"]) == {"day", "night"}
          for mode in ("day", "night"):
              path = root / (mode + ".webp")
              with Image.open(path) as image:
                  assert image.size == (2048, 1024)
              assert path.stat().st_size < 1_200_000
          print("PASS: local day and night sky panoramas are valid 2K WebP")
          PY
      - name: Commit optimized CC0 sky textures to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epoch/assets/sky/day.webp epoch/assets/sky/night.webp epoch/assets/sky/manifest.json
          if git diff --cached --quiet; then
            echo "No sky asset changes"
          else
            git commit -m "Epoch: add optimized local CC0 day and night sky panoramas"
            git push origin HEAD:main
          fi
