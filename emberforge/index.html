<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080d14">
<meta name="description" content="Play Emberforge, a browser-based idle fantasy RPG.">
<title>Emberforge</title>
<style>
  :root{color-scheme:dark;--gold:#eac28c}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{min-height:100dvh;height:100dvh;overflow:hidden;background:#091221;color:#ecf0f4;display:flex;flex-direction:column;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .site-topbar{height:58px;min-height:58px;position:relative;z-index:10;background:#080d14;border-bottom:1px solid #ffffff24}
  .site-inner{height:100%;max-width:1160px;padding:0 22px;margin:0 auto;display:flex;align-items:center;gap:28px;min-width:0}
  .site-brand{font-size:20px;font-weight:900;letter-spacing:-1px;color:#ecf0f4;text-decoration:none;flex:0 0 auto}
  .site-brand span{color:var(--gold)}
  .site-links{display:flex;align-items:center;gap:22px;margin-left:auto;overflow-x:auto;scrollbar-width:none;white-space:nowrap;min-width:0}
  .site-links::-webkit-scrollbar{display:none}
  .site-links a{flex:0 0 auto;padding:9px 0;color:#b6c2cf;text-decoration:none;font-size:13px;font-weight:600;transition:color .15s}
  .site-links a:hover{color:#fff}
  .site-links a[aria-current=page]{color:var(--gold);border:1px solid #eac28c70;border-radius:8px;padding:8px 12px;font-weight:750}
  a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  .site-menu-button{display:none;margin-left:auto;border:1px solid #354350;border-radius:8px;background:#19232d;padding:8px 12px;color:#ecf0f4;font:inherit;cursor:pointer}
  .site-context{color:#d6b482;font-size:13px;white-space:nowrap}
  @media(max-width:800px){.site-inner{position:relative}.site-menu-button{display:block}.site-links{display:none;position:absolute;left:0;right:0;top:100%;max-height:calc(100dvh - 60px);overflow-y:auto;flex-direction:column;align-items:stretch;gap:4px;background:#080d14;padding:12px 20px 16px;border:1px solid #ffffff24;border-top:0;border-radius:0 0 12px 12px;box-shadow:0 20px 45px #0008}.site-links.open{display:flex}.site-links a{width:100%;padding:11px 5px;font-size:14px}}
  #game{border:0;background:#091221;display:block;width:100%;flex:1 1 auto;min-height:0}
  @media(max-width:620px){.site-topbar{height:54px;min-height:54px}.site-inner{gap:13px;padding:0 12px}.site-brand{font-size:17px}.site-links{gap:13px}.site-links a{font-size:12px}.site-links a[aria-current=page]{padding:7px 9px}}
</style>
</head>
<body>
<header class="site-topbar">
  <div class="site-inner">
    <a class="site-brand" href="/" aria-label="Spencer Veen home">SV<span>.</span></a>
    <span class="site-context">/ Emberforge</span>
    <button class="site-menu-button" type="button" aria-controls="game-site-nav" aria-expanded="false">Menu ☰</button>
    <nav class="site-links" id="game-site-nav" aria-label="Site-wide navigation">
      <a href="/">Home</a>
      <a href="/ai-projects/">AI Projects</a>
      <a href="/non-ai-projects/">Non-AI Projects</a>
      <a href="/#about">About</a>
      <a href="/resume/">Résumé</a>
      <a href="/connect/">Connect</a>
    </nav>
  </div>
</header>
<iframe id="game" src="./game.html?v=50" title="Emberforge game" allow="fullscreen; clipboard-write"></iframe>
<script src="./emberforge-hud.js?v=7"></script>
<script src="./emberforge-forge.js?v=8"></script>
<script src="./emberforge-battle.js?v=40"></script>
<script>
  const menuButton = document.querySelector('.site-menu-button');
  const menuLinks = document.querySelector('.site-links');
  menuButton.addEventListener('click', () => {
    const open = menuLinks.classList.toggle('open');
    menuButton.setAttribute('aria-expanded', String(open));
  });
  menuLinks.querySelectorAll('a').forEach(link => link.addEventListener('click', () => {
    menuLinks.classList.remove('open');
    menuButton.setAttribute('aria-expanded', 'false');
  }));
  // The HUD uses the original game elements and keeps save/combat logic in game.html.
  const gameFrame = document.getElementById('game');
  // Hide only the engine-owned boss instruction elements, never remove nodes.
  function attachHud() {
    try {
      const d = gameFrame.contentDocument;
      if (d && !d.getElementById('efb-tip-off')) {
        const rule = d.createElement('style');
        rule.id = 'efb-tip-off';
        rule.textContent = '#ef4-combattip,#ef4-bosslootnote {display:none!important;visibility:hidden!important}';
        (d.head || d.documentElement).appendChild(rule);
      }
    } catch (_) {}
    if (window.EmberforgeHUD) window.EmberforgeHUD.mount(gameFrame);
    if (window.EmberforgeForge) window.EmberforgeForge.mount(gameFrame);
    if (window.EmberforgeBattle) window.EmberforgeBattle.mount(gameFrame);
  }
  gameFrame.addEventListener('load', attachHud);
  // Some game views are initialized lazily; apply the Forge skin on selection.
  gameFrame.addEventListener('load', () => {
    try {
      gameFrame.contentDocument.addEventListener('click', () => {
        setTimeout(() => { window.EmberforgeForge?.mount(gameFrame); window.EmberforgeBattle?.mount(gameFrame); }, 60);
      });
    } catch (_) {}
  });
  if (gameFrame.contentDocument?.querySelector('#ef4')) attachHud();
  // Battle is populated lazily by the game. Retry only while the redesigned
  // view has not mounted, then stop trying; no repeated DOM transformations.
  const battleMountRetry = setInterval(() => {
    try {
      const d = gameFrame.contentDocument;
      const view = d?.querySelector('#ef4 [data-view="battle"]');
      if (!view) return;
      if (view.dataset.efBattleSkin === '1') { clearInterval(battleMountRetry); return; }
      window.EmberforgeBattle?.mount(gameFrame);
      if (view.dataset.efBattleSkin === "1") clearInterval(battleMountRetry);
    } catch (error) {
      console.warn('[Emberforge Battle] mount retry:', error);
    }
  }, 1500);
</script>
</body>
</html>
